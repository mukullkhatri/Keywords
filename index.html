<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPSC GS Mains: Microtheme Keywords</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#14213d;--mut:#5b667a;--line:#dde2ea;--ex:#eef3fb;
--g1:#0f766e;--g2:#3949ab;--g3:#a16207;--g4:#86366b}
@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#171e2e;--ink:#e6ebf5;--mut:#98a3b8;--line:#27314a;--ex:#1c2640;
--g1:#2dd4bf;--g2:#8c9eff;--g3:#fbbf24;--g4:#f0a3d4}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0}
.wrap{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
nav{position:sticky;top:0;height:100vh;overflow:auto;padding:18px 14px;border-right:1px solid var(--line);background:var(--card)}
nav h1{font-size:19px;line-height:1.25;margin-bottom:4px}
nav p{margin:0 0 14px;color:var(--mut);font-size:12.5px}
.pp{font:600 12px/1 system-ui;color:var(--mut);margin:14px 0 6px}
.sb{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:7px 8px;border-radius:8px;cursor:pointer;font:inherit}
.sb:hover,.sb.on{background:var(--ex)}
.sb .dot{width:9px;height:9px;border-radius:50%;flex:none}
.sb .n{margin-left:auto;font-size:12px;color:var(--mut)}
main{padding:20px clamp(14px,3vw,36px) 60px;max-width:1000px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px;display:flex;gap:8px;flex-wrap:wrap}
.bar input{flex:1;min-width:180px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.bar button{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;font:inherit}
.hd{display:flex;align-items:center;gap:14px;margin:10px 0 14px}
.hd h2{font-size:28px}
.hd .st{color:var(--mut);font-size:13px}
.ring{width:46px;height:46px;flex:none}
details{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;margin:0 0 10px}
summary{cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;list-style:none;font-weight:600}
summary::-webkit-details-marker{display:none}
summary:before{content:"+";color:var(--c);font-weight:700;width:14px}
details[open]>summary:before{content:"\2212"}
.b{margin-left:auto;font-size:12px;font-weight:500;color:var(--mut);white-space:nowrap}
.kw{padding:10px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:22px 1fr;gap:8px}
.kw input{margin-top:4px;accent-color:var(--c);width:16px;height:16px}
.kw.done .t{text-decoration:line-through;opacity:.55}
.t{font-weight:700}
.d{margin:2px 0 6px}
.e{background:var(--ex);border-left:3px solid var(--c);border-radius:6px;padding:5px 9px;font-size:13.5px;color:var(--mut)}
.e b{color:var(--ink);font-weight:600}
mark{background:#ffe066;color:#111;border-radius:3px}
.empty{padding:30px;text-align:center;color:var(--mut)}
@media(max-width:800px){.wrap{display:block}nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
.sbs{display:flex;flex-wrap:wrap;gap:4px}.sb{width:auto;border:1px solid var(--line);padding:5px 9px}.sb .n{display:none}.pp{display:none}
.bar{top:0}.hd h2{font-size:23px}}
:focus-visible{outline:2px solid var(--g2);outline-offset:2px}
</style></head><body>

<script>
const D=[{"s": "Art and Culture", "g": "GS1", "t": [{"m": "Dance forms", "p": 1, "k": [["Natya Shastra", "Ancient text (Bharata Muni) on drama, dance, music; source of classical dance grammar.", "Basis of Bharatanatyam, Odissi etc."], ["Tandava vs Lasya", "Tandava = vigorous dance of Shiva; Lasya = soft, graceful style linked to Parvati.", "Chola Nataraja bronzes show Ananda Tandava."], ["Abhinaya and Mudra", "Abhinaya = expression-based storytelling; Mudra = codified hand gesture.", "Bharatanatyam and Kathakali narrate epics through these."], ["Classical dance recognition", "Sangeet Natak Akademi recognises 8 classical forms (Bharatanatyam, Kathak, Kuchipudi, Odissi, Kathakali, Sattriya, Manipuri, Mohiniyattam).", "Sattriya (Assam) got status in 2000."]]}, {"m": "Conservation of Indian Art & Heritage", "p": 1, "k": [["Intangible Cultural Heritage", "Living traditions (rituals, performing arts, crafts) passed across generations; UNESCO 2003 Convention.", "Kumbh Mela, Yoga, Garba on UNESCO ICH list."], ["AMASR Act 1958", "Law protecting ASI monuments; 100 m prohibited and 200 m regulated zone around them (2010 amendment).", "Construction near Qutub Minar needs permission."], ["Adopt a Heritage", "Scheme letting private firms maintain monuments under CSR.", "Dalmia Bharat adopted Red Fort (2018)."], ["Adaptive reuse", "Giving old buildings a new function while keeping their character.", "Heritage havelis turned into hotels/museums."]]}, {"m": "Bhakti and Sufi movement", "p": 3, "k": [["Bhakti", "Devotional movement stressing personal love for God over ritual and caste hierarchy.", "Alvars and Nayanars in the South; Kabir, Mirabai in the North."], ["Nirguna vs Saguna", "Nirguna = formless God; Saguna = God with form.", "Kabir (Nirguna), Tulsidas (Saguna)."], ["Sufism and Silsilas", "Mystic Islam seeking union with God via love, music, service; orders called silsilas (Chishti, Suhrawardi).", "Nizamuddin Dargah; qawwali."], ["Syncretism", "Blending of beliefs of different faiths.", "Guru Granth Sahib includes verses of Kabir and Baba Farid."], ["Vernacular literature", "Writing in regional languages instead of Sanskrit/Persian.", "Tulsidas (Awadhi), Tukaram (Marathi)."]]}, {"m": "Buddhism", "p": 3, "k": [["Stupa", "Dome-shaped mound holding relics, symbol of Buddha.", "Sanchi, Amaravati."], ["Gandhara vs Mathura school", "Gandhara = Greco-Roman influenced, realistic drapery; Mathura = indigenous, red sandstone.", "Both flourished under Kushanas."], ["Chaitya and Vihara", "Chaitya = prayer hall with stupa; Vihara = monks' residence.", "Karle chaitya, Ajanta caves."], ["Dhamma (Ashoka)", "Ethical code of tolerance, non-violence, welfare, spread by edicts and Dhamma Mahamatras.", "Early example of welfare-state ethics."], ["Pala Buddhism", "Pala kings (Bengal-Bihar) patronised Vajrayana and big monasteries.", "Nalanda, Vikramshila, Odantapuri."]]}, {"m": "Civilizations & Highlights", "p": 5, "k": [["Harappan urban planning", "Grid streets, covered drains, granaries, standardised bricks.", "Mohenjo-daro Great Bath; Dholavira water harvesting (UNESCO 2021). Compare with modern sewerage in smart cities."], ["Rig Vedic vs Later Vedic", "Early = pastoral, tribal, sabha/samiti; Later = territorial kingdoms, rigid varna, iron use.", "Sabha/Samiti are early assembly models like today's Gram Sabha."], ["Cultural continuity", "Indian traditions survived without a total break, unlike Egypt, Mesopotamia.", "Living Ganga rituals, Sanskrit shlokas in public life."], ["Urbanisation link", "Indus ideas (drainage, planned grids) echo in modern town planning.", "Chandigarh's sector-grid layout."]]}, {"m": "Indian Philosophy", "p": 1, "k": [["Shad Darshana", "Six orthodox schools: Nyaya, Vaisheshika, Sankhya, Yoga, Mimamsa, Vedanta.", "Karma-moksha ideas shaped temple iconography."], ["Mandala and Garbhagriha", "Temple plan symbolising cosmos; sanctum = innermost seat of deity.", "Layout of Khajuraho and Konark temples."], ["Dharma", "Duty and moral order guiding conduct.", "Supreme Court motto Yato dharmastato jayah."]]}, {"m": "Kingdoms & Highlights", "p": 8, "k": [["Temple styles (Nagara, Dravida, Vesara)", "North, South and hybrid Deccan temple styles.", "Chandella Khajuraho (Nagara); Chola Brihadeeswara (Dravida)."], ["Lost-wax casting", "Metal casting via wax model (cire perdue), used in Chola bronzes.", "Nataraja of Chidambaram."], ["Kudavolai system", "Village-assembly election by pot-ticket under Cholas (Uttaramerur inscriptions).", "Early grassroots democracy; compare Panchayati Raj."], ["Gupta numismatics", "Gold coins (dinaras) with fine artistry and royal imagery.", "Samudragupta's lyre-player coin."], ["Sultanate technology", "New tools such as Persian wheel, spinning wheel, paper.", "Boosted irrigation and textile trade."], ["Pallava art", "Rock-cut rathas and structural temples.", "Mahabalipuram shore temple (UNESCO)."]]}, {"m": "Kings & Contributions", "p": 2, "k": [["Sulh-i-kul", "Akbar's policy of universal peace and tolerance.", "Ibadat Khana debates; precursor of secular ethos."], ["Patronage", "Royal support to scholars and artists.", "Krishnadevaraya's Ashtadiggajas; Amuktamalyada."]]}, {"m": "Miscellaneous", "p": 2, "k": [["Geographical determinism", "Geography shaping history: Himalaya as barrier, rivers as cradles.", "Gangetic plain's fertile belt fed the Mauryan empire."], ["Taxila vs Nalanda", "Taxila = teacher-centred learning hub on Silk Route; Nalanda = organised residential university.", "Contrast with today's UGC-regulated universities."]]}, {"m": "Travellers", "p": 1, "k": [["Foreign accounts as sources", "Outsiders' records used to rebuild history.", "Megasthenes (Indica), Fa-Hien, Hiuen Tsang, Al-Biruni, Ibn Battuta."], ["Source criticism", "Checking bias of traveller accounts.", "Hiuen Tsang's Buddhist-centred view of Harsha's court."]]}, {"m": "Sculptures and Significance", "p": 2, "k": [["Temple sculpture as social record", "Carvings show dress, dance, trade, daily life.", "Khajuraho and Konark panels."], ["Lion and bull motifs", "Lion = power/sovereignty; bull = fertility/dharma.", "Sarnath lion capital is the national emblem; bull on Indus seals."]]}, {"m": "Rock-cut Architecture as Historical Sources", "p": 2, "k": [["Rock-cut architecture", "Temples/halls carved from living rock.", "Ajanta, Ellora's Kailasa (Rashtrakuta), Barabar caves."], ["Mesolithic rock art", "Painted shelters of prehistoric hunter-gatherers.", "Bhimbetka (UNESCO)."]]}, {"m": "Literature as Historical Sources", "p": 2, "k": [["Sangam literature", "Early Tamil poetry showing society, trade, and polity.", "Silappadikaram; Roman trade references."], ["Persian chronicles", "Court histories of medieval India.", "Barani's Tarikh, Abul Fazl's Akbarnama."], ["Rajatarangini", "Kalhana's chronicle of Kashmir, earliest history-writing in India.", "Used as model of critical history."]]}]}, {"s": "Modern History", "g": "GS1", "t": [{"m": "Colonial rule and impact", "p": 5, "k": [["Drain of Wealth", "Transfer of India's surplus to Britain without equal return (Dadabhai Naoroji).", "Home Charges; Poverty and Un-British Rule in India."], ["Deindustrialisation", "Collapse of Indian handicrafts under British imports and tariffs.", "Decline of Dhaka muslin."], ["Subsidiary Alliance", "Wellesley's system: ruler accepts British troops and pays for them.", "Hyderabad, Awadh lost autonomy."], ["Commercialisation and famines", "Cash crops and revenue pressure raised famine risk.", "Indigo; Great Bengal Famine 1943; Famine Codes."], ["Tribal revolts", "Tribal resistance to land alienation and forest laws.", "Santhal Hul 1855; Birsa Munda's Ulgulan led to Chotanagpur Tenancy Act 1908; link to FRA 2006."], ["Land revenue systems", "Permanent Settlement (zamindars), Ryotwari (peasant), Mahalwari (village).", "Rural indebtedness in Bengal."]]}, {"m": "Gandhi X Indian Leaders of Freedom Struggle", "p": 5, "k": [["Satyagraha", "Non-violent resistance rooted in truth.", "Champaran 1917, Salt March 1930."], ["Trusteeship", "Wealthy as trustees of society's wealth.", "Link to CSR today."], ["Poona Pact 1932", "Gandhi-Ambedkar deal: reserved seats in general electorate, not separate.", "Roots of SC reservation."], ["Nai Talim vs Visva-Bharati", "Gandhi: work-based basic education; Tagore: creative, global outlook.", "Wardha scheme 1937."], ["Bose's approach", "Armed struggle and foreign alliance, INA.", "Chalo Delhi; Forward Bloc."]]}, {"m": "Revolt and Mutiny", "p": 5, "k": [["1857 Revolt", "Large uprising by sepoys and civilians against Company rule.", "Led to GoI Act 1858 and Queen's Proclamation."], ["Doctrine of Lapse", "Dalhousie's rule annexing states without natural heir.", "Satara, Jhansi, Nagpur."], ["Naval Mutiny 1946", "RIN ratings' revolt in Bombay; shook British confidence.", "Showed Armed forces no longer reliable."], ["Fragmented polity", "Post-Mughal fragmentation into regional powers.", "Marathas, Nizam, Awadh, Mysore."], ["Panipat", "Delhi's gateway where empires clashed.", "1526, 1556, 1761."]]}, {"m": "Socio-religious reform", "p": 3, "k": [["Brahmo Samaj", "Ram Mohan Roy's 1828 monotheist movement.", "Sati banned 1829."], ["Young Bengal", "Derozio's rationalist group.", "Challenged orthodoxy and blind custom."], ["Satyashodhak Samaj", "Phule's 1873 movement for lower-caste and women's rights.", "Gulamgiri; girls' school in Pune."], ["Women's reform laws", "Series of laws on women's status.", "Widow Remarriage Act 1856; Sharda Act 1929."], ["Arya Samaj", "Dayanand's 1875 Vedic revivalism with Shuddhi.", "DAV schools."]]}, {"m": "Viceroy and their Administration", "p": 2, "k": [["Cornwallis", "Father of civil services; Permanent Settlement.", "Basis of IAS/ICS lineage."], ["Dalhousie", "Railways, telegraph, postal reforms, Doctrine of Lapse.", "First railway 1853."], ["Ripon", "Local self-government resolution 1882.", "Basis of Panchayati Raj thinking."], ["Curzon", "Partition of Bengal 1905, Universities Act 1904, Ancient Monuments Act 1904.", "Sparked Swadeshi movement."]]}, {"m": "Acts and their Features", "p": 1, "k": [["Regulating Act 1773", "First Parliament control over Company; Governor-General of Bengal.", "Supreme Court at Calcutta."], ["Morley-Minto Reforms 1909", "Separate electorates for Muslims.", "Seeded communal politics."], ["Dyarchy (GoI Act 1919)", "Provincial subjects split between ministers and governor.", "Transferred vs reserved subjects."], ["GoI Act 1935", "Provincial autonomy, federal court, federation proposal.", "Source of much of Constitution (Governor, emergency provisions, PSC)."], ["Rowlatt Act 1919", "Detention without trial.", "Triggered Jallianwala Bagh protest."]]}, {"m": "Important contributors/contribution", "p": 4, "k": [["Moderates vs Extremists", "Moderates: petitions and prayers; Extremists: boycott and Swadeshi.", "Gokhale vs Tilak."], ["Women in freedom struggle", "Leadership in movements.", "Sarojini Naidu, Aruna Asaf Ali, Kasturba Gandhi."], ["Foreign contributors", "Foreigners supporting Indian cause.", "Annie Besant (Home Rule), Mirabehn, C F Andrews."], ["Constructive programme", "Gandhi's village-level reform plan: khadi, untouchability removal.", "Basis of Sarvodaya and rural self-reliance."]]}, {"m": "Various stages of Freedom struggle", "p": 5, "k": [["Non-Cooperation 1920-22", "Mass boycott of British institutions.", "Ended after Chauri Chaura."], ["Civil Disobedience 1930", "Breaking laws like salt law.", "Dandi March."], ["Quit India 1942", "Do or Die mass movement.", "Leaders arrested; people-led resistance."], ["Cabinet Mission 1946", "Plan for federal India and interim government.", "Led to Constituent Assembly."]]}]}, {"s": "Post Independence", "g": "GS1", "t": [{"m": "Foreign influence on Independent India's policies", "p": 1, "k": [["Non-Alignment", "Staying out of US-USSR military blocs.", "Bandung 1955, NAM 1961; now called strategic autonomy."], ["Panchsheel", "Five principles of peaceful coexistence (1954 India-China).", "Mutual respect for sovereignty."], ["Planning and mixed economy", "State leads heavy industry; private sector coexists.", "Soviet-style Five Year Plans."]]}, {"m": "Land reform", "p": 1, "k": [["Zamindari abolition", "Removing intermediaries between state and tiller.", "Early 1950s state laws."], ["Land ceiling and tenancy reform", "Limit on holdings; security to tenants.", "Operation Barga in West Bengal."], ["Bhoodan", "Voluntary land donation movement of Vinoba Bhave (1951).", "Pochampally gift of land."], ["Ninth Schedule", "Laws shielded from judicial review.", "Land reform laws placed here."]]}, {"m": "Personalities Contribution", "p": 1, "k": [["Sardar Patel", "Integrated princely states, strengthened services.", "Operation Polo 1948; All India Services."], ["Vikram Sarabhai and Homi Bhabha", "Founders of space and atomic programmes.", "ISRO and BARC."], ["Verghese Kurien", "Father of White Revolution.", "Operation Flood, Amul model."]]}, {"m": "Slogan based", "p": 1, "k": [["Jai Jawan Jai Kisan", "Shastri's slogan linking soldier and farmer.", "1965 war and food shortage."], ["Garibi Hatao", "Indira Gandhi 1971 poverty slogan.", "20 Point Programme."], ["Total Revolution", "JP Narayan's 1974 call for broad social change.", "Bihar movement, Emergency backdrop."]]}, {"m": "States Reorganisation", "p": 3, "k": [["Linguistic states demand", "Reorganisation on language lines.", "Potti Sriramulu's fast led to Andhra State 1953."], ["SRC 1953 and SRA 1956", "Fazl Ali Commission; 14 states and 6 UTs.", "Replaced A, B, C, D state categories."], ["Later reorganisation", "Bifurcation due to regional demands.", "Maharashtra-Gujarat 1960, Punjab-Haryana 1966, Telangana 2014."]]}, {"m": "Consolidation after Independence", "p": 2, "k": [["Instrument of Accession", "Document by which a princely state joined India.", "Kashmir 1947."], ["Integration of princely states", "Over 560 states merged through persuasion and force.", "Hyderabad, Junagadh."], ["Privy purses", "Allowances to ex-rulers; ended by 26th Amendment 1971.", "Equality principle."], ["Integration of colonial pockets", "Ending French and Portuguese rule.", "Pondicherry 1954, Goa 1961."]]}, {"m": "Wars after Independence", "p": 2, "k": [["Kashmir war 1947-48", "First India-Pakistan war, led to UN ceasefire line.", "Led to LoC."], ["Sino-Indian War 1962", "Border war lost by India.", "Defence reforms followed."], ["1971 War", "Bangladesh liberation, Shimla Agreement 1972.", "93,000 POWs surrendered."], ["Kargil 1999", "Limited conflict after infiltration.", "Operation Vijay; Kargil Review Committee."]]}]}, {"s": "World History", "g": "GS1", "t": [{"m": "American and French revolution", "p": 3, "k": [["American Revolution", "Colonists' war for independence from Britain, 1776.", "No taxation without representation; Bill of Rights."], ["French Revolution", "1789 uprising against monarchy and feudal privilege.", "Liberty, Equality, Fraternity in Indian Preamble."], ["Declaration of Rights of Man", "1789 charter of natural rights.", "Inspired global human rights thinking."], ["Popular sovereignty", "Authority comes from people.", "Basis of modern democracy."]]}, {"m": "Anti-colonial struggles", "p": 4, "k": [["Decolonisation", "End of colonial rule after WWII.", "India 1947, Ghana 1957."], ["Bandung Conference 1955", "Afro-Asian solidarity forum.", "Led to NAM."], ["Neo-colonialism", "Indirect control through economy.", "Debt dependence."]]}, {"m": "Great Economic Depression", "p": 1, "k": [["Wall Street Crash 1929", "Stock market collapse beginning global slump.", "Mass unemployment."], ["New Deal", "Roosevelt's state-led recovery and welfare programme.", "Social Security Act 1935."], ["Keynesian economics", "Government spending to revive demand.", "MGNREGA as counter-cyclical support."], ["Protectionism", "Trade barriers to protect home industry.", "Smoot-Hawley Tariff worsened the crisis."]]}, {"m": "Industrial Revolution", "p": 3, "k": [["Mechanisation and factory system", "Machines replaced handwork; factories grew.", "Spinning jenny, steam engine."], ["Urbanisation", "Rural-urban shift to industrial towns.", "Manchester; slums and public health laws."], ["Imperial raw-material hunger", "Industry needed colonies for raw materials and markets.", "Cotton from India."]]}, {"m": "Miscellaneous", "p": 3, "k": [["Railways' effects", "Linked markets and moved troops.", "In India aided exports and famine relief alike."], ["Indentured labour", "Contract labour sent after slavery's end.", "Indians to Mauritius, Fiji, Trinidad."], ["Suez Crisis 1956", "Britain-France-Israel attack after Egypt nationalised the canal.", "Ended Britain's great-power image."]]}, {"m": "World wars", "p": 3, "k": [["WWI and Versailles", "1914-18 war; harsh peace of 1919.", "Redrawn borders; seeds of WWII."], ["League of Nations", "Post-WWI body; failed to stop aggression.", "Led to UN in 1945."], ["WWII outcomes", "Decolonisation, UN, Bretton Woods, Cold War.", "IMF and World Bank."]]}]}, {"s": "Society", "g": "GS1", "t": [{"m": "Diversity and pluralism", "p": 6, "k": [["Pluralism", "Peaceful coexistence of many cultures, religions, languages.", "Eighth Schedule recognises 22 languages."], ["Unity in Diversity", "Shared national identity above differences.", "Ek Bharat Shreshtha Bharat state-pairing programme."], ["Cultural syncretism", "Blending of traditions into new forms.", "Ganga-Jamuni tehzeeb of north India."]]}, {"m": "Tribes & Related Issues", "p": 4, "k": [["Scheduled Tribes", "Communities listed under Article 342 for special protection.", "Gonds, Santhals."], ["PESA 1996", "Gives Gram Sabhas power in Scheduled Areas.", "Gram Sabha consent for mining in tribal land."], ["Forest Rights Act 2006", "Recognises tribal and forest-dweller rights over forest land.", "Niyamgiri hills Gram Sabha decision against bauxite mining."], ["PVTG", "Particularly Vulnerable Tribal Groups with declining population.", "Great Andamanese, Bondas; PM-JANMAN 2023."]]}, {"m": "Family", "p": 5, "k function ring(n,t,c){const p=t?n/t:0,r=19,L=2*Math.PI*r;return '<svg class="ring" viewBox="0 0 46 46"><circle cx="23" cy="23" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="23" cy="23" r="'+r+'" fill="none" stroke="'+c+'" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+(L*p)+' '+L+'" transform="rotate(-90 23 23)"/><text x="23" y="27" text-anchor="middle" font-size="11" fill="var(--ink)">'+Math.round(p*100)+'%</text></svg>'}
function card(i,j,x,k,c){const id=key(i,j,x),dn=S[id];return '<div class="kw'+(dn?' done':'')+'" style="--c:'+c+'"><input type="checkbox" data-id="'+id+'" '+(dn?'checked':'')+' aria-label="Mark revised"><div><div class="t">'+hl(k[0])+'</div><div class="d">'+hl(k[1])+'</div><div class="e"><b>Example:</b> '+hl(k[2])+'</div></div></div>'}
function render(open){
const o=document.getElementById('out');let h='';
const list=q?D.map((d,i)=>i):[cur];
let hits=0;
list.forEach(i=>{const d=D[i],c=C[d.g];let sec='';
d.t.forEach((m,j)=>{const ks=m.k.map((k,x)=>[k,x]).filter(([k])=>!q||(k.join(' ')+' '+m.m).toLowerCase().includes(q.toLowerCase()));
if(!ks.length)return;hits+=ks.length;
sec+='<details style="--c:'+c+'"'+(q||open?' open':'')+'><summary>'+hl(m.m)+'<span class="b">PYQs '+m.p+' | '+ks.length+' kw</span></summary>'+ks.map(([k,x])=>card(i,j,x,k,c)).join('')+'</details>'});
if(!sec)return;
const[n,t]=done(i);
h+='<div class="hd" style="color:'+c+'">'+ring(n,t,c)+'<div><h2 style="color:var(--ink)">'+esc(d.s)+'</h2><div class="st">'+d.g+' | '+d.t.length+' microthemes | '+t+' keywords</div></div></div>'+sec});
o.innerHTML=h||'<div class="empty">No keyword matches. Try a shorter word.</div>';nav()}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('.sb');if(!b)return;cur=+b.dataset.i;q='';document.getElementById('q').value='';render();scrollTo(0,0)});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim();render()});
document.getElementById('out').addEventListener('change',e=>{const id=e.target.dataset.id;if(!id)return;if(e.target.checked)S[id]=1;else delete S[id];save();e.target.closest('.kw').classList.toggle('done',e.target.checked);nav()});
document.getElementById('ex').onclick=()=>document.querySelectorAll('details').forEach(d=>d.open=true);
document.getElementById('co').onclick=()=>document.querySelectorAll('details').forEach(d=>d.open=false);
document.getElementById('rs').onclick=()=>{if(confirm('Clear all revised ticks?')){S={};save();render()}};
render();
</script></body></html>
